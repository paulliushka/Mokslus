<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Pamokų žurnalas</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/config.js" defer></script>
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pamokų žurnalas</h1>

        <div class="card">
            <div class="week-nav">
                <button type="button" class="btn btn-secondary" id="prevWeekBtn"
                        aria-label="Ankstesnė savaitė">← Praeita savaitė</button>
                <h2 id="currentWeekRangeLabel" class="title-clean">Savaitė</h2>
                <button type="button" class="btn btn-secondary" id="nextWeekBtn"
                        aria-label="Kita savaitė">Kita savaitė →</button>
            </div>

            <div id="daysScheduleContainer"></div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};
        let allTimetables = [];
        let weekOffset = 0;

        const MAX_WEEK_OFFSET = 52;

        const DAYS_CONFIG = [
            { name: 'Pirmadienis', offset: 0 },
            { name: 'Antradienis', offset: 1 },
            { name: 'Trečiadienis', offset: 2 },
            { name: 'Ketvirtadienis', offset: 3 },
            { name: 'Penktadienis', offset: 4 }
        ];

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();

                if (currentUser.role !== 'teacher') {
                    showToast('Puslapis pasiekiamas tik mokytojams.', 'error');
                    window.location.href = 'dashboard';
                    return;
                }

                await loadTimetablesData();
                bindEvents();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function bindEvents() {
            document.getElementById('prevWeekBtn').addEventListener('click', () => changeWeek(-1));
            document.getElementById('nextWeekBtn').addEventListener('click', () => changeWeek(1));
        }

        async function loadTimetablesData() {
            try {
                const res = await fetch(`${API_URL}/api/timetables`, { credentials: 'include' });
                if (res.status === 401) { window.location.href = '/'; return; }
                if (!res.ok) throw new Error('bad status');
                const data = await res.json();
                allTimetables = Array.isArray(data) ? data : [];
                renderWeekDaysSchedule();
            } catch (err) {
                showToast('Nepavyko užkrauti tvarkaraščio.', 'error');
            }
        }

        function changeWeek(direction) {
            const newOffset = weekOffset + direction;
            if (newOffset < -MAX_WEEK_OFFSET || newOffset > MAX_WEEK_OFFSET) return;
            weekOffset = newOffset;
            renderWeekDaysSchedule();
        }

        function getDaysOfCurrentWeek() {
            const curr = new Date();
            const dayOfWeek = curr.getDay();
            const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(curr);
            monday.setDate(curr.getDate() + diffToMonday + (weekOffset * 7));
            monday.setHours(0, 0, 0, 0);

            return DAYS_CONFIG.map(d => {
                const targetDate = new Date(monday);
                targetDate.setDate(monday.getDate() + d.offset);
                const year = targetDate.getFullYear();
                const month = String(targetDate.getMonth() + 1).padStart(2, '0');
                const day = String(targetDate.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;

                return {
                    day_of_week: d.name,
                    date: dateStr,
                    displayDate: `${d.name} (${month}-${day})`
                };
            });
        }

        function makeElement(tag, className, text) {
            const el = document.createElement(tag);
            if (className) el.className = className;
            if (text != null) el.textContent = text;
            return el;
        }

        function renderWeekDaysSchedule() {
            const container = document.getElementById('daysScheduleContainer');
            container.replaceChildren();

            const weekDays = getDaysOfCurrentWeek();
            document.getElementById('currentWeekRangeLabel').textContent =
                `Savaitė: ${weekDays[0].date} iki ${weekDays[4].date}`;

            weekDays.forEach(dayObj => {
                const dayTimetables = allTimetables
                    .filter(t => t.day_of_week === dayObj.day_of_week)
                    .sort((a, b) => (a.lesson_order || '').localeCompare(b.lesson_order || ''));

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-section';

                const title = makeElement('div', 'day-title', dayObj.displayDate);
                const count = makeElement('span', 'day-count',
                    dayTimetables.length === 0 ? '(nėra pamokų)' : `(${dayTimetables.length})`);
                title.appendChild(count);
                dayDiv.appendChild(title);

                if (dayTimetables.length === 0) {
                    const empty = makeElement('div', 'empty-state', 'Šią dieną pamokų nėra.');
                    dayDiv.appendChild(empty);
                } else {
                    const listDiv = document.createElement('div');
                    listDiv.className = 'lesson-grid-list';

                    dayTimetables.forEach(t => {
                        listDiv.appendChild(renderLessonCard(t, dayObj.date));
                    });
                    dayDiv.appendChild(listDiv);
                }

                container.appendChild(dayDiv);
            });
        }

        function renderLessonCard(t, dateStr) {
            const card = document.createElement('div');
            card.className = 'lesson-item-card clickable';
            card.title = 'Spauskite norėdami atidaryti pamokos žurnalą';
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');

            const groupLine = makeElement('div', 'lesson-group', t.group_display || '-');
            card.appendChild(groupLine);

            card.appendChild(makeElement('div', 'lesson-order', `Pamoka: ${t.lesson_order || '-'}`));
            card.appendChild(makeElement('div', 'lesson-meta', `Kabinetas: ${t.classroom || '-'}`));
            card.appendChild(makeElement('div', 'lesson-meta', `Mokytojas: ${t.teacher || '-'}`));

            const openLesson = () => {
                window.location.href =
                    `editing/edit_lesson?group_id=${encodeURIComponent(t.group_id)}&date=${encodeURIComponent(dateStr)}`;
            };

            card.addEventListener('click', openLesson);
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openLesson();
                }
            });

            return card;
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
