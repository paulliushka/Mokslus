<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Redaguoti pastabą</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="config.js" defer></script>
    <script src="calendar.js" defer></script>
    <script src="select.js" defer></script>
    <script src="toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pagyrimai ir pastabos</h1>

        <div class="card">
            <h2>Redaguoti įrašą</h2>

            <div id="infoPanel" class="info-panel d-none" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px;">
                <div class="info-item">
                    <div class="info-label">Grupė</div>
                    <div class="info-value" id="infoGroup">–</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Mokinys</div>
                    <div class="info-value" id="infoStudent">–</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Tipas</div>
                    <div class="info-value" id="infoType">–</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Autorius</div>
                    <div class="info-value" id="infoAuthor">–</div>
                </div>
            </div>

            <div id="formWrapper" class="d-none">
                <form id="editRemarkForm" novalidate>
                    <div class="form-group">
                        <label for="type">Tipas</label>
                        <select name="type" id="type" required>
                            <option value="praise">Pagyrimas</option>
                            <option value="reprimand">Pastaba</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="content">Turinys</label>
                        <textarea name="content" id="content" rows="3" maxlength="1000"
                                  placeholder="Įrašykite pastabos ar pagyrimo tekstą..." required></textarea>
                        <div class="char-counter" id="contentCounter">0 / 1000</div>
                    </div>

                    <div class="form-group">
                        <label for="date">Data</label>
                        <input type="date" name="date" id="date" required>
                    </div>

                    <div class="mt-15">
                        <button type="submit" class="btn btn-primary" id="saveBtn">Išsaugoti</button>
                    </div>
                </form>
            </div>

            <div id="emptyState" class="empty-state d-none">
                <div class="empty-icon">🔍</div>
                <h3>Įrašas nerastas</h3>
                <p>Įrašas su nurodytu ID neegzistuoja arba neturite teisių jį redaguoti.</p>
            </div>

            <br>
            <a href="remarks" class="btn-back">← Grįžti atgal</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const remarkId = urlParams.get('id');

        let currentUser = {};
        let currentRemark = null;
        let submitting = false;

        const VALID_TYPES = ['praise', 'reprimand'];
        const TYPE_LABELS = { praise: 'Pagyrimas', reprimand: 'Pastaba' };

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();

                if (currentUser.role !== 'teacher') {
                    showToast('Puslapis pasiekiamas tik mokytojams.', 'error');
                    window.location.href = 'dashboard';
                    return;
                }

                if (!remarkId) {
                    window.location.href = 'remarks';
                    return;
                }

                await loadRemark();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function showEmptyState() {
            document.getElementById('formWrapper').classList.add('d-none');
            document.getElementById('infoPanel').classList.add('d-none');
            document.getElementById('emptyState').classList.remove('d-none');
        }

        async function loadRemark() {
            try {
                const response = await fetch(`${API_URL}/api/remarks`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const remarks = await response.json();

                const item = (remarks || []).find(r => String(r.remark_id) === String(remarkId));
                if (!item) {
                    showEmptyState();
                    return;
                }

                const groupTeacherIds = (item.group_teachers || []).map(Number);
                const hasAccess = groupTeacherIds.includes(Number(currentUser.user_id));

                if (!hasAccess) {
                    showEmptyState();
                    showToast('Neturite teisių redaguoti šio įrašo.', 'error');
                    return;
                }

                currentRemark = item;
                fillForm(item);
                renderInfoPanel(item);

                document.getElementById('formWrapper').classList.remove('d-none');

                document.getElementById('editRemarkForm').addEventListener('submit', handleSubmit);
                document.getElementById('content').addEventListener('input', updateContentCounter);

                if (typeof initCalendarPickers === 'function') initCalendarPickers();
                if (typeof initCustomSelects === 'function') initCustomSelects();
            } catch (err) {
                showToast('Nepavyko užkrauti įrašo duomenų.', 'error');
            }
        }

        function fillForm(item) {
            const typeVal = VALID_TYPES.includes(item.type) ? item.type : 'praise';
            document.getElementById('type').value = typeVal;
            document.getElementById('content').value = item.content || '';
            document.getElementById('date').value = item.date || '';

            updateContentCounter();
        }

        function renderInfoPanel(item) {
            document.getElementById('infoPanel').classList.remove('d-none');
            document.getElementById('infoGroup').textContent = item.group_display || '–';
            document.getElementById('infoStudent').textContent = item.student || '–';
            document.getElementById('infoAuthor').textContent = item.teacher || '–';

            const typeEl = document.getElementById('infoType');
            typeEl.replaceChildren();

            const typeVal = VALID_TYPES.includes(item.type) ? item.type : 'praise';
            const badge = document.createElement('span');
            badge.className = `remark-type-badge ${typeVal}`;
            badge.textContent = TYPE_LABELS[typeVal];
            typeEl.appendChild(badge);
        }

        function updateContentCounter() {
            const textarea = document.getElementById('content');
            const counter = document.getElementById('contentCounter');
            const len = textarea.value.length;
            counter.textContent = `${len} / 1000`;
            counter.classList.toggle('over', len > 1000);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (submitting) return;

            const type = document.getElementById('type').value;
            const content = document.getElementById('content').value.trim();
            const date = document.getElementById('date').value;

            if (!VALID_TYPES.includes(type)) {
                showToast('Neteisingas įrašo tipas.', 'error');
                return;
            }
            if (!content) {
                showToast('Įveskite turinį.', 'error');
                return;
            }
            if (content.length > 1000) {
                showToast('Turinys per ilgas (max 1000 simbolių).', 'error');
                return;
            }
            if (!date) {
                showToast('Pasirinkite datą.', 'error');
                return;
            }

            submitting = true;
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Saugoma...';

            try {
                const res = await fetch(`${API_URL}/api/remarks/edit/${encodeURIComponent(remarkId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        type: type,
                        content: content,
                        date: date
                    })
                });
                const result = await res.json().catch(() => ({}));
                if (res.ok) {
                    showToast('Įrašas atnaujintas!', 'success');
                    setTimeout(() => { window.location.href = 'remarks'; }, 600);
                } else {
                    showToast(result.message || 'Nepavyko išsaugoti įrašo.', 'error');
                }
            } catch (err) {
                showToast('Nepavyko prisijungti prie serverio.', 'error');
            } finally {
                submitting = false;
                btn.disabled = false;
                btn.textContent = 'Išsaugoti';
            }
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
