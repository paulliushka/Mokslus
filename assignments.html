<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Namų darbai</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="config.js" defer></script>
    <script src="calendar.js" defer></script>
    <script src="select.js" defer></script>
    <script src="toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Namų darbai ir užduotys</h1>

        <div class="stats-row" id="statsRow"></div>

        <div class="card">
            <h2>Esamos užduotys</h2>

            <div class="assignments-toolbar">
                <div class="form-group">
                    <label for="filter_status" style="margin-top:0;">Rodyti</label>
                    <select id="filter_status">
                        <option value="">-- Visus --</option>
                        <option value="active">Aktyvius</option>
                        <option value="overdue">Pasibaigusius</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter_search" style="margin-top:0;">Paieška</label>
                    <input type="text" id="filter_search" maxlength="100" autocomplete="off"
                           placeholder="Užduotis / dalykas / mokytojas...">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Grupė / Dalykas</th>
                            <th>Užduotis</th>
                            <th>Atlikti iki</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="assignmentsTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let allAssignments = [];

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                const currentUser = await response.json();

                if (currentUser.role !== 'student') {
                    showToast('Puslapis pasiekiamas tik mokiniams.', 'error');
                    window.location.href = 'dashboard';
                    return;
                }

                await loadAssignments();
                initFilters();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function initFilters() {
            document.getElementById('filter_status').addEventListener('change', filterAssignments);
            document.getElementById('filter_search').addEventListener('input', filterAssignments);
            if (typeof initCustomSelects === 'function') initCustomSelects();
        }

        async function loadAssignments() {
            try {
                const response = await fetch(`${API_URL}/api/assignments`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const data = await response.json();
                allAssignments = Array.isArray(data) ? data : [];
                renderStats();
                filterAssignments();
            } catch (error) {
                showToast('Nepavyko užkrauti namų darbų.', 'error');
            }
        }

        function parseDate(str) {
            if (!str) return null;
            const m = String(str).trim().match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
            if (!m) return null;
            const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            if (isNaN(d.getTime())) return null;
            return d;
        }

        function startOfToday() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function daysUntil(dateStr) {
            const d = parseDate(dateStr);
            if (!d) return null;
            const today = startOfToday();
            const diffMs = d.getTime() - today.getTime();
            return Math.round(diffMs / (24 * 60 * 60 * 1000));
        }

        function dueStatus(dateStr) {
            const days = daysUntil(dateStr);
            if (days === null) return 'unknown';
            if (days < 0) return 'overdue';
            if (days === 0) return 'today';
            if (days <= 3) return 'soon';
            return 'later';
        }

        function dueLabel(dateStr) {
            const days = daysUntil(dateStr);
            if (days === null) return dateStr || '-';
            if (days < 0) return `${dateStr} (vėluoja ${Math.abs(days)} d.)`;
            if (days === 0) return `${dateStr} (šiandien)`;
            if (days === 1) return `${dateStr} (rytoj)`;
            if (days <= 3) return `${dateStr} (po ${days} d.)`;
            return dateStr;
        }

        function makeCell(label, child) {
            const td = document.createElement('td');
            td.setAttribute('data-label', label);
            td.appendChild(child);
            return td;
        }

        function renderStats() {
            const container = document.getElementById('statsRow');
            container.replaceChildren();

            const active = allAssignments.filter(a => dueStatus(a.due_date) !== 'overdue').length;
            const overdue = allAssignments.filter(a => dueStatus(a.due_date) === 'overdue').length;

            const stats = [
                { label: 'Aktyvūs', value: String(active), cls: active > 0 ? 'urgent' : '' },
                { label: 'Pasibaigę', value: String(overdue), cls: overdue > 0 ? 'done' : '' },
                { label: 'Iš viso', value: String(allAssignments.length), cls: '' }
            ];

            stats.forEach(s => {
                const card = document.createElement('div');
                card.className = 'stat-card' + (s.cls ? ' ' + s.cls : '');

                const label = document.createElement('div');
                label.className = 'stat-label';
                label.textContent = s.label;

                const value = document.createElement('div');
                value.className = 'stat-value';
                value.textContent = s.value;

                card.appendChild(label);
                card.appendChild(value);
                container.appendChild(card);
            });
        }

        function renderAssignments(assignments) {
            const tbody = document.getElementById('assignmentsTableBody');
            tbody.replaceChildren();

            if (assignments.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 4;
                td.className = 'empty-row';

                if (allAssignments.length === 0) {
                    const wrap = document.createElement('div');
                    wrap.className = 'empty-state';

                    const icon = document.createElement('div');
                    icon.className = 'empty-icon';
                    icon.textContent = '📝';

                    const h3 = document.createElement('h3');
                    h3.textContent = 'Namų darbų dar nėra';

                    const p = document.createElement('p');
                    p.textContent = 'Kai mokytojai įrašys namų darbus, jie atsiras čia.';

                    wrap.appendChild(icon);
                    wrap.appendChild(h3);
                    wrap.appendChild(p);
                    td.appendChild(wrap);
                } else {
                    td.textContent = 'Pagal pasirinktus filtrus užduočių nerasta.';
                    td.style.textAlign = 'center';
                    td.style.fontStyle = 'italic';
                }

                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            const sorted = [...assignments].sort((a, b) => {
                const da = parseDate(a.due_date);
                const db = parseDate(b.due_date);
                if (da && db) {
                    const diff = da.getTime() - db.getTime();
                    if (diff !== 0) return diff;
                } else if (da) {
                    return -1;
                } else if (db) {
                    return 1;
                }
                return String(a.group_display || '').localeCompare(String(b.group_display || ''), 'lt');
            });

            sorted.forEach(assign => {
                const tr = document.createElement('tr');

                const groupStrong = document.createElement('strong');
                groupStrong.textContent = assign.group_display || '-';
                tr.appendChild(makeCell('Grupė / Dalykas', groupStrong));

                const taskDiv = document.createElement('div');
                taskDiv.className = 'task-cell';
                taskDiv.textContent = assign.task || '-';
                tr.appendChild(makeCell('Užduotis', taskDiv));

                const status = dueStatus(assign.due_date);
                const dueBadge = document.createElement('span');
                dueBadge.className = `due-badge ${status}`;
                dueBadge.textContent = dueLabel(assign.due_date);
                tr.appendChild(makeCell('Atlikti iki', dueBadge));

                tr.appendChild(makeCell('Mokytojas',
                    document.createTextNode(assign.teacher || '-')));

                tbody.appendChild(tr);
            });
        }

        function filterAssignments() {
            const filterStatus = document.getElementById('filter_status').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allAssignments.filter(a => {
                const status = dueStatus(a.due_date);
                if (filterStatus === 'active' && status === 'overdue') return false;
                if (filterStatus === 'overdue' && status !== 'overdue') return false;

                if (searchText) {
                    const combined = `${a.task || ''} ${a.group_display || ''} ${a.teacher || ''}`.toLowerCase();
                    if (!combined.includes(searchText)) return false;
                }
                return true;
            });

            renderAssignments(filtered);
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
