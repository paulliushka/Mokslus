<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Redaguoti grupę</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../static/styles/style.css">
    <link rel="manifest" href="../static/pwa/manifest.json">
    <script src="../static/js/calendar.js" defer></script>
    <script src="../static/js/config.js" defer></script>
    <script src="../static/js/select.js" defer></script>
    <script src="../static/js/toast.js" defer></script>
    <style>
        /* --- edit_group.html lokalūs stiliai --- */
        .info-panel {
            background: var(--card-bg-alt, #f9fafb);
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }
        .info-panel .info-item { display: flex; flex-direction: column; }
        .info-panel .info-label {
            font-size: 0.78em;
            color: var(--text-muted, #888);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .info-panel .info-value {
            font-weight: 600;
            font-size: 0.95em;
            word-break: break-word;
        }

        .scroll-box {
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 8px;
            padding: 8px 12px;
            background: var(--card-bg, #fff);
        }
        .scroll-box label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .scroll-box label:hover { background: rgba(0,0,0,0.03); }
        .scroll-box label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .scroll-box .empty-msg {
            color: var(--text-muted, #888);
            font-style: italic;
            padding: 8px;
            text-align: center;
        }

        .selection-info {
            font-size: 0.9em;
            color: var(--text-muted, #888);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .class-change-warning {
            background: rgba(255, 140, 0, 0.12);
            border: 1px solid rgba(255, 140, 0, 0.35);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.9em;
            color: #b45309;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .form-group { margin-bottom: 14px; }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color, #e5e7eb);
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted, #888);
        }
        .empty-state .empty-icon { font-size: 3em; margin-bottom: 12px; }
        .empty-state h3 { margin: 0 0 8px; color: var(--text-primary, #111); }
        .empty-state p { margin: 0; font-size: 0.95em; }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grupės</h1>

        <div class="card">
            <h2>Redaguoti grupę</h2>

            <div id="infoPanel" class="info-panel d-none">
                <div class="info-item">
                    <div class="info-label">Grupės ID</div>
                    <div class="info-value" id="infoGroupId">–</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Dabartinis pavadinimas</div>
                    <div class="info-value" id="infoGroupName">–</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Mokinių</div>
                    <div class="info-value" id="infoStudentCount">–</div>
                </div>
            </div>

            <div id="formWrapper" class="d-none">
                <form id="editGroupForm" novalidate>
                    <div class="form-group">
                        <label for="group_name">Pavadinimas</label>
                        <input type="text" name="group_name" id="group_name"
                               maxlength="100" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="class_select">Klasė</label>
                        <select name="class" id="class_select" required>
                            <option value="">-- Pasirinkite klasę --</option>
                        </select>
                    </div>

                    <div id="classChangeWarning" class="class-change-warning d-none">
                        <span>⚠️</span>
                        <span>Keičiate grupės klasę. Visi pasirinkti mokiniai turi priklausyti naujai klasei, kitaip išsaugoti nepavyks.</span>
                    </div>

                    <div class="form-group">
                        <label>Mokiniai</label>
                        <div class="btn-row">
                            <button type="button" class="btn btn-secondary" id="selectAllBtn">Pasirinkti visus</button>
                            <button type="button" class="btn btn-secondary" id="deselectAllBtn">Nuimti visus</button>
                        </div>
                        <div id="students_container" class="scroll-box">
                            <p class="empty-msg">Kraunami mokiniai...</p>
                        </div>
                        <div class="selection-info" id="selectionInfo"></div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="saveBtn">Išsaugoti</button>
                    </div>
                </form>
            </div>

            <div id="emptyState" class="empty-state d-none">
                <div class="empty-icon">🔍</div>
                <h3>Grupė nerasta</h3>
                <p>Grupė su nurodytu ID neegzistuoja arba neturite teisių.</p>
            </div>

            <br>
            <a href="../groups" class="btn-back">← Grįžti atgal</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const groupId = urlParams.get('id');

        let currentUser = {};
        let group = null;
        let originalClass = '';
        let currentGroupStudents = [];
        let studentsRequestId = 0;
        let submitting = false;

        // ------------------------------------------------------------------
        // Init
        // ------------------------------------------------------------------
        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();

                if (currentUser.role !== 'teacher') {
                    showToast('Puslapis pasiekiamas tik mokytojams.', 'error');
                    window.location.href = '../dashboard';
                    return;
                }

                if (!groupId) {
                    window.location.href = '../groups';
                    return;
                }

                await initPage();
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function initPage() {
            try {
                const res = await fetch(`${API_URL}/api/groups/${encodeURIComponent(groupId)}`, { credentials: 'include' });
                if (res.status === 404) { showEmptyState(); return; }
                if (res.status === 401) { window.location.href = '/'; return; }
                if (!res.ok) throw new Error('bad status');

                group = await res.json();
                currentGroupStudents = (group.students || []).map(Number);
                originalClass = group.class || '';

                // Užpildome formą
                document.getElementById('group_name').value = group.group_name || '';
                renderInfoPanel(group);

                // Klasės
                const classesResp = await fetch(`${API_URL}/api/classes`, { credentials: 'include' });
                if (!classesResp.ok) throw new Error('classes bad status');
                const classes = await classesResp.json();

                const classSelect = document.getElementById('class_select');
                classSelect.replaceChildren();

                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '-- Pasirinkite klasę --';
                classSelect.appendChild(placeholder);

                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = `${c} klasė`;
                    if (c === originalClass) opt.selected = true;
                    classSelect.appendChild(opt);
                });

                // Jei originali klasė nėra classes sąraše - pridedame
                if (originalClass && !classes.includes(originalClass)) {
                    const opt = document.createElement('option');
                    opt.value = originalClass;
                    opt.textContent = `${originalClass} klasė`;
                    opt.selected = true;
                    classSelect.appendChild(opt);
                }

                document.getElementById('formWrapper').classList.remove('d-none');

                // Event listeners
                classSelect.addEventListener('change', onClassChange);
                document.getElementById('selectAllBtn').addEventListener('click', () => setAllStudents(true));
                document.getElementById('deselectAllBtn').addEventListener('click', () => setAllStudents(false));
                document.getElementById('editGroupForm').addEventListener('submit', handleSubmit);

                await loadStudentsByClass();

                if (typeof initCustomSelects === 'function') initCustomSelects();
            } catch (err) {
                showToast('Nepavyko užkrauti grupės duomenų.', 'error');
            }
        }

        function showEmptyState() {
            document.getElementById('formWrapper').classList.add('d-none');
            document.getElementById('infoPanel').classList.add('d-none');
            document.getElementById('emptyState').classList.remove('d-none');
        }

        // ------------------------------------------------------------------
        // Info panelė
        // ------------------------------------------------------------------
        function renderInfoPanel(g) {
            document.getElementById('infoPanel').classList.remove('d-none');
            document.getElementById('infoGroupId').textContent = g.group_id || '–';
            document.getElementById('infoGroupName').textContent = g.group_name || '–';
            document.getElementById('infoStudentCount').textContent = (g.students || []).length;
        }

        // ------------------------------------------------------------------
        // Klasės keitimas
        // ------------------------------------------------------------------
        async function onClassChange() {
            const newClass = document.getElementById('class_select').value;
            const warning = document.getElementById('classChangeWarning');

            if (newClass && newClass !== originalClass) {
                warning.classList.remove('d-none');
            } else {
                warning.classList.add('d-none');
            }

            await loadStudentsByClass();
        }

        // ------------------------------------------------------------------
        // Mokinių sąrašas
        // ------------------------------------------------------------------
        async function loadStudentsByClass() {
            const className = document.getElementById('class_select').value;
            const container = document.getElementById('students_container');
            const requestId = ++studentsRequestId;

            container.replaceChildren();
            updateSelectionInfo();

            if (!className) {
                const msg = document.createElement('p');
                msg.className = 'empty-msg';
                msg.textContent = 'Pirmiausia pasirinkite klasę.';
                container.appendChild(msg);
                return;
            }

            const loading = document.createElement('p');
            loading.className = 'empty-msg';
            loading.textContent = 'Kraunami mokiniai...';
            container.appendChild(loading);

            try {
                const response = await fetch(`${API_URL}/get_students/${encodeURIComponent(className)}`,
                    { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const data = await response.json();

                if (requestId !== studentsRequestId) return;

                container.replaceChildren();

                if (!Array.isArray(data) || data.length === 0) {
                    const msg = document.createElement('p');
                    msg.className = 'empty-msg';
                    msg.textContent = 'Šioje klasėje mokinių nėra.';
                    container.appendChild(msg);
                    return;
                }

                // Rikiuojame pagal pavardę
                const sorted = [...data].sort((a, b) =>
                    String(a.surname || '').localeCompare(String(b.surname || ''), 'lt'));

                sorted.forEach(student => {
                    const label = document.createElement('label');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'students';
                    checkbox.className = 'student-checkbox';
                    checkbox.value = student.user_id;

                    if (currentGroupStudents.includes(Number(student.user_id))) {
                        checkbox.checked = true;
                    }
                    checkbox.addEventListener('change', updateSelectionInfo);

                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = `${student.name || ''} ${student.surname || ''}`.trim();

                    label.appendChild(checkbox);
                    label.appendChild(nameSpan);
                    container.appendChild(label);
                });

                updateSelectionInfo();
            } catch (err) {
                if (requestId !== studentsRequestId) return;
                container.replaceChildren();
                const msg = document.createElement('p');
                msg.className = 'empty-msg';
                msg.textContent = 'Nepavyko užkrauti mokinių.';
                container.appendChild(msg);
                showToast('Nepavyko užkrauti mokinių.', 'error');
            }
        }

        function setAllStudents(checked) {
            document.querySelectorAll('.student-checkbox').forEach(cb => { cb.checked = checked; });
            updateSelectionInfo();
        }

        function updateSelectionInfo() {
            const checked = document.querySelectorAll('.student-checkbox:checked').length;
            const total = document.querySelectorAll('.student-checkbox').length;
            const info = document.getElementById('selectionInfo');

            info.replaceChildren();

            const span = document.createElement('span');
            span.textContent = `Pasirinkta: ${checked} / ${total}`;
            info.appendChild(span);

            // Skirtumas nuo pradinio sąrašo
            if (group && group.students) {
                const currentIds = new Set(Array.from(document.querySelectorAll('.student-checkbox:checked'))
                    .map(cb => Number(cb.value)));
                const originalIds = new Set((group.students || []).map(Number));

                const added = [...currentIds].filter(id => !originalIds.has(id)).length;
                const removed = [...originalIds].filter(id => !currentIds.has(id)).length;

                if (added > 0 || removed > 0) {
                    const diff = document.createElement('span');
                    diff.style.color = 'var(--accent-blue, #2563eb)';
                    diff.textContent = `(pokyčiai: +${added} / −${removed})`;
                    info.appendChild(diff);
                }
            }

            // Mygtukų būsena
            document.getElementById('selectAllBtn').disabled = total === 0 || checked === total;
            document.getElementById('deselectAllBtn').disabled = total === 0 || checked === 0;
        }

        // ------------------------------------------------------------------
        // Submit
        // ------------------------------------------------------------------
        async function handleSubmit(e) {
            e.preventDefault();
            if (submitting) return;

            const groupName = document.getElementById('group_name').value.trim();
            const className = document.getElementById('class_select').value;
            const studentIds = Array.from(document.querySelectorAll('.student-checkbox:checked'))
                .map(cb => Number(cb.value));

            if (!groupName) {
                showToast('Įveskite grupės pavadinimą.', 'error');
                return;
            }
            if (!className) {
                showToast('Pasirinkite klasę.', 'error');
                return;
            }

            submitting = true;
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Saugoma...';

            try {
                const res = await fetch(`${API_URL}/api/groups/edit/${encodeURIComponent(groupId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        group_name: groupName,
                        class: className,
                        students: studentIds
                    })
                });
                const result = await res.json().catch(() => ({}));
                if (res.ok) {
                    showToast('Grupė atnaujinta!', 'success');
                    setTimeout(() => { window.location.href = '../groups'; }, 600);
                } else {
                    showToast(result.message || 'Nepavyko išsaugoti grupės.', 'error');
                }
            } catch (err) {
                showToast('Nepavyko prisijungti prie serverio.', 'error');
            } finally {
                submitting = false;
                btn.disabled = false;
                btn.textContent = 'Išsaugoti';
            }
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
