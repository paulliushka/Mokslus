<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Pažymiai</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="config.js" defer></script>
    <script src="calendar.js" defer></script>
    <script src="select.js" defer></script>
    <script src="toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Mano pažymiai</h1>

        <div class="stats-row" id="statsRow"></div>

        <div class="card">
            <h2>Pažymių sąrašas</h2>

            <div class="grades-toolbar">
                <div class="form-group">
                    <label for="filter_type" style="margin-top:0;">Filtruoti pagal tipą</label>
                    <select id="filter_type">
                        <option value="">-- Visi tipai --</option>
                        <option value="Klasės darbas">Klasės darbas</option>
                        <option value="Namų darbas">Namų darbas</option>
                        <option value="Kontrolinis darbas">Kontrolinis darbas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter_search" style="margin-top:0;">Paieška</label>
                    <input type="text" id="filter_search" maxlength="100" autocomplete="off"
                           placeholder="Dalykas / komentaras / mokytojas...">
                </div>
            </div>

            <!-- VISADA rodomas lentelės rėmas -->
            <div class="table-responsive" id="gradesTableWrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Pažymys</th>
                            <th>Tipas</th>
                            <th>Data</th>
                            <th>Komentaras</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="gradesTableBody"></tbody>
                </table>
            </div>

            <!-- Skyriai pagal dalyką (rodomi tik kai yra pažymių) -->
            <div id="gradesBySubject" class="d-none"></div>
        </div>

        <a href="/dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let allGrades = [];

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                const currentUser = await response.json();

                if (currentUser.role !== 'student') {
                    showToast('Puslapis pasiekiamas tik mokiniams.', 'error');
                    window.location.href = '/dashboard';
                    return;
                }

                await loadGrades();
                initFilters();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function initFilters() {
            document.getElementById('filter_type').addEventListener('change', filterGrades);
            document.getElementById('filter_search').addEventListener('input', filterGrades);
            if (typeof initCustomSelects === 'function') initCustomSelects();
        }

        async function loadGrades() {
            try {
                const response = await fetch(`${API_URL}/api/grades`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const data = await response.json();
                allGrades = Array.isArray(data) ? data : [];
                renderStats();
                filterGrades();
            } catch (error) {
                showToast('Nepavyko užkrauti pažymių.', 'error');
            }
        }

        function gradeClass(grade) {
            const num = parseFloat(String(grade).replace(',', '.'));
            if (isNaN(num)) return 'neutral';
            if (num >= 9) return 'excellent';
            if (num >= 7) return 'good';
            if (num >= 5) return 'average';
            if (num >= 4) return 'poor';
            return 'fail';
        }

        function averageOfGrades(grades) {
            const nums = grades
                .map(g => parseFloat(String(g.grade).replace(',', '.')))
                .filter(n => !isNaN(n));
            if (nums.length === 0) return null;
            const sum = nums.reduce((a, b) => a + b, 0);
            return sum / nums.length;
        }

        function formatAvg(avg) {
            if (avg === null) return '–';
            return avg.toFixed(2);
        }

        function makeCell(label, child) {
            const td = document.createElement('td');
            td.setAttribute('data-label', label);
            td.appendChild(child);
            return td;
        }

        function renderStats() {
            const container = document.getElementById('statsRow');
            container.replaceChildren();

            const totalCount = allGrades.length;
            const uniqueSubjects = new Set(allGrades.map(g => g.group_display)).size;
            const avg = averageOfGrades(allGrades);

            const stats = [
                { label: 'Iš viso pažymių', value: String(totalCount) },
                { label: 'Dalykų', value: String(uniqueSubjects) },
                { label: 'Bendras vidurkis', value: formatAvg(avg) }
            ];

            stats.forEach(s => {
                const card = document.createElement('div');
                card.className = 'stat-card';

                const label = document.createElement('div');
                label.className = 'stat-label';
                label.textContent = s.label;

                const value = document.createElement('div');
                value.className = 'stat-value';
                value.textContent = s.value;

                card.appendChild(label);
                card.appendChild(value);
                container.appendChild(card);
            });
        }

        /**
         * Užpildo lentelę tuščia būsena (kai nėra pažymių arba filtras nieko nerado).
         */
        function renderTableEmpty(message, submessage) {
            const tbody = document.getElementById('gradesTableBody');
            tbody.replaceChildren();

            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 5;
            td.className = 'empty-row';

            const wrap = document.createElement('div');
            wrap.className = 'empty-state';

            const icon = document.createElement('div');
            icon.className = 'empty-icon';
            icon.textContent = '📊';

            const h3 = document.createElement('h3');
            h3.textContent = message;

            const p = document.createElement('p');
            p.textContent = submessage;

            wrap.appendChild(icon);
            wrap.appendChild(h3);
            wrap.appendChild(p);
            td.appendChild(wrap);
            tr.appendChild(td);
            tbody.appendChild(tr);
        }

        /**
         * Užpildo lentelę realiais pažymiais (kai yra 1 dalykas arba filtras).
         */
        function renderTableFlat(grades) {
            const tbody = document.getElementById('gradesTableBody');
            tbody.replaceChildren();

            const sorted = [...grades].sort((a, b) =>
                String(b.date || '').localeCompare(String(a.date || '')));

            sorted.forEach(g => {
                const tr = document.createElement('tr');

                const gradeBadge = document.createElement('span');
                gradeBadge.className = `grade-badge ${gradeClass(g.grade)}`;
                gradeBadge.textContent = g.grade || '–';
                tr.appendChild(makeCell('Pažymys', gradeBadge));

                tr.appendChild(makeCell('Tipas', document.createTextNode(g.type || '-')));

                tr.appendChild(makeCell('Data', document.createTextNode(g.date || '-')));

                const commentDiv = document.createElement('div');
                commentDiv.className = 'grade-comment';
                commentDiv.textContent = g.comment || '-';
                tr.appendChild(makeCell('Komentaras', commentDiv));

                tr.appendChild(makeCell('Mokytojas', document.createTextNode(g.teacher || '-')));

                tbody.appendChild(tr);
            });
        }

        /**
         * Užpildo skyrius pagal dalyką (kai yra 2+ dalykų).
         */
        function renderBySubject(grades) {
            const container = document.getElementById('gradesBySubject');
            container.replaceChildren();

            const groups = new Map();
            grades.forEach(g => {
                const key = g.group_display || 'Nežinomas dalykas';
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(g);
            });

            const sortedKeys = Array.from(groups.keys()).sort((a, b) =>
                String(a).localeCompare(String(b), 'lt'));

            sortedKeys.forEach(subjectKey => {
                const subjectGrades = groups.get(subjectKey);

                const section = document.createElement('details');
                section.className = 'subject-section';
                section.open = true;

                const summary = document.createElement('summary');
                const subjectName = document.createElement('span');
                subjectName.textContent = subjectKey;

                const subjectAvg = document.createElement('span');
                subjectAvg.className = 'subject-avg';
                const avg = averageOfGrades(subjectGrades);
                subjectAvg.textContent = `Vidurkis: ${formatAvg(avg)} · ${subjectGrades.length} įr.`;

                summary.appendChild(subjectName);
                summary.appendChild(subjectAvg);
                section.appendChild(summary);

                const tableWrap = document.createElement('div');
                tableWrap.className = 'table-responsive';

                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                ['Pažymys', 'Tipas', 'Data', 'Komentaras', 'Mokytojas'].forEach(h => {
                    const th = document.createElement('th');
                    th.textContent = h;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                const sorted = [...subjectGrades].sort((a, b) =>
                    String(b.date || '').localeCompare(String(a.date || '')));

                sorted.forEach(g => {
                    const tr = document.createElement('tr');

                    const gradeBadge = document.createElement('span');
                    gradeBadge.className = `grade-badge ${gradeClass(g.grade)}`;
                    gradeBadge.textContent = g.grade || '–';
                    tr.appendChild(makeCell('Pažymys', gradeBadge));

                    tr.appendChild(makeCell('Tipas', document.createTextNode(g.type || '-')));
                    tr.appendChild(makeCell('Data', document.createTextNode(g.date || '-')));

                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'grade-comment';
                    commentDiv.textContent = g.comment || '-';
                    tr.appendChild(makeCell('Komentaras', commentDiv));

                    tr.appendChild(makeCell('Mokytojas', document.createTextNode(g.teacher || '-')));

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                tableWrap.appendChild(table);
                section.appendChild(tableWrap);
                container.appendChild(section);
            });
        }

        /**
         * Pagrindinė atvaizdavimo funkcija.
         * - Jei pažymių nėra → lentelė su empty-state
         * - Jei 1 dalykas → lentelė plokščia (be skyrių)
         * - Jei 2+ dalykų → skyriai pagal dalyką
         */
        function renderGrades(grades) {
            const tableWrapper = document.getElementById('gradesTableWrapper');
            const bySubject = document.getElementById('gradesBySubject');

            if (grades.length === 0) {
                tableWrapper.classList.remove('d-none');
                bySubject.classList.add('d-none');

                if (allGrades.length === 0) {
                    renderTableEmpty(
                        'Pažymių dar nėra',
                        'Kai mokytojai įrašys pažymius, jie atsiras čia.'
                    );
                } else {
                    renderTableEmpty(
                        'Pagal pasirinktus filtrus pažymių nerasta',
                        'Pabandykite pakeisti filtrą arba paieškos žodį.'
                    );
                }
                return;
            }

            // Grupuojame pagal dalyką
            const uniqueSubjects = new Set(grades.map(g => g.group_display || 'Nežinomas dalykas'));

            if (uniqueSubjects.size <= 1) {
                // Vienas dalykas (arba filtruota iki vieno) - plokščia lentelė
                tableWrapper.classList.remove('d-none');
                bySubject.classList.add('d-none');
                renderTableFlat(grades);
            } else {
                // Keli dalykai - skyriai pagal dalyką
                tableWrapper.classList.add('d-none');
                bySubject.classList.remove('d-none');
                renderBySubject(grades);
            }
        }

        function filterGrades() {
            const filterType = document.getElementById('filter_type').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allGrades.filter(g => {
                if (filterType && g.type !== filterType) return false;
                if (searchText) {
                    const combined = `${g.group_display || ''} ${g.comment || ''} ${g.teacher || ''} ${g.type || ''}`.toLowerCase();
                    if (!combined.includes(searchText)) return false;
                }
                return true;
            });

            renderGrades(filtered);
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
