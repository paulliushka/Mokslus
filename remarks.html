<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Pagyrimai ir pastabos</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/config.js" defer></script>
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pagyrimai ir pastabos</h1>

        <div class="card d-none" id="addRemarkCard">
            <h2>Įrašyti pagyrimą arba pastabą</h2>

            <form id="addRemarkForm" class="add-remark-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="group_select">Grupė</label>
                        <select name="group_id" id="group_select" required>
                            <option value="">-- Pasirinkite grupę --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="student_select">Mokinys</label>
                        <select name="student_id" id="student_select" required disabled>
                            <option value="">-- Pirmiausia pasirinkite grupę --</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="type_select">Tipas</label>
                        <select name="type" id="type_select" required>
                            <option value="praise">Pagyrimas</option>
                            <option value="reprimand">Pastaba</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="remark_date">Data</label>
                        <input type="date" name="date" id="remark_date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="remark_content">Turinys</label>
                    <textarea name="content" id="remark_content" rows="3" maxlength="1000"
                              placeholder="Įrašykite pastabos ar pagyrimo tekstą..." required></textarea>
                    <div class="char-counter" id="contentCounter">0 / 1000</div>
                </div>

                <button type="submit" class="btn btn-primary mt-15" id="submitRemarkBtn">Įrašyti</button>
            </form>
        </div>

        <div class="card">
            <h2>Įrašų sąrašas</h2>

            <div class="remarks-toolbar">
                <div class="form-group">
                    <label for="filter_type" style="margin-top:0;">Filtruoti pagal tipą</label>
                    <select id="filter_type">
                        <option value="">-- Visi tipai --</option>
                        <option value="praise">Pagyrimai</option>
                        <option value="reprimand">Pastabos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter_search" style="margin-top:0;">Paieška</label>
                    <input type="text" id="filter_search" maxlength="100" autocomplete="off"
                           placeholder="Mokinys / turinys / mokytojas...">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Mokinys</th>
                            <th>Grupė</th>
                            <th>Tipas</th>
                            <th>Turinys</th>
                            <th>Data</th>
                            <th>Mokytojas</th>
                            <th id="actionsHeader" class="d-none">Veiksmai</th>
                        </tr>
                    </thead>
                    <tbody id="remarksTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};
        let allRemarks = [];
        let submittingRemark = false;

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();
            } catch (err) {
                window.location.href = '/';
                return;
            }

            if (currentUser.role !== 'teacher' && currentUser.role !== 'student') {
                showToast('Puslapis pasiekiamas tik mokiniams ir mokytojams.', 'error');
                window.location.href = 'dashboard';
                return;
            }

            await initPage();
        }

        async function initPage() {
            if (currentUser.role === 'teacher') {
                document.getElementById('addRemarkCard').classList.remove('d-none');
                setDefaultDate();
                await loadTeacherGroups();
                document.getElementById('group_select').addEventListener('change', loadStudentsByGroup);
                document.getElementById('remark_content').addEventListener('input', updateContentCounter);
            }

            await loadRemarks();

            document.getElementById('filter_type').addEventListener('change', filterRemarks);
            document.getElementById('filter_search').addEventListener('input', filterRemarks);

            if (typeof initCalendarPickers === 'function') initCalendarPickers();
            if (typeof initCustomSelects === 'function') initCustomSelects();
        }

        function setDefaultDate() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateInput = document.getElementById('remark_date');
            if (dateInput) {
                dateInput.value = `${now.getFullYear()}-${month}-${day}`;
                dateInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        function updateContentCounter() {
            const textarea = document.getElementById('remark_content');
            const counter = document.getElementById('contentCounter');
            const len = textarea.value.length;
            counter.textContent = `${len} / 1000`;
            counter.classList.toggle('over', len > 1000);
        }

        async function loadTeacherGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const groups = await response.json();
                const select = document.getElementById('group_select');
                select.replaceChildren();

                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '-- Pasirinkite grupę --';
                select.appendChild(placeholder);

                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.group_id;
                    opt.textContent = `${g.group_name} (${g.class} klasė)`;
                    select.appendChild(opt);
                });
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                showToast('Nepavyko užkrauti grupių.', 'error');
            }
        }

        async function loadStudentsByGroup() {
            const groupId = document.getElementById('group_select').value;
            const select = document.getElementById('student_select');
            select.replaceChildren();

            if (!groupId) {
                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '-- Pirmiausia pasirinkite grupę --';
                select.appendChild(placeholder);
                select.disabled = true;
                select.dispatchEvent(new Event('change', { bubbles: true }));
                return;
            }

            select.disabled = true;
            const loading = document.createElement('option');
            loading.value = '';
            loading.textContent = 'Kraunami mokiniai...';
            select.appendChild(loading);

            try {
                const response = await fetch(`${API_URL}/get_students_by_group/${encodeURIComponent(groupId)}`,
                    { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const students = await response.json();

                select.replaceChildren();
                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '-- Pasirinkite mokinį --';
                select.appendChild(placeholder);

                students.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.user_id;
                    opt.textContent = `${s.name} ${s.surname}`;
                    select.appendChild(opt);
                });
                select.disabled = false;
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                select.replaceChildren();
                const errOpt = document.createElement('option');
                errOpt.value = '';
                errOpt.textContent = 'Nepavyko užkrauti mokinių.';
                select.appendChild(errOpt);
                showToast('Nepavyko užkrauti mokinių.', 'error');
            }
        }

        async function loadRemarks() {
            try {
                const response = await fetch(`${API_URL}/api/remarks`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const data = await response.json();
                allRemarks = Array.isArray(data) ? data : [];
                filterRemarks();
            } catch (error) {
                showToast('Nepavyko užkrauti įrašų sąrašo.', 'error');
            }
        }

        function makeCell(label, child) {
            const td = document.createElement('td');
            td.setAttribute('data-label', label);
            td.appendChild(child);
            return td;
        }

        function mutedText(text) {
            const span = document.createElement('span');
            span.className = 'text-muted-italic';
            span.textContent = text;
            return span;
        }

        function renderRemarks(remarks) {
            const tbody = document.getElementById('remarksTableBody');
            tbody.replaceChildren();

            const showActions = currentUser.role === 'teacher';
            const actionsHeader = document.getElementById('actionsHeader');
            actionsHeader.classList.toggle('d-none', !showActions);

            if (remarks.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = showActions ? 7 : 6;
                td.className = 'empty-row';
                td.textContent = allRemarks.length === 0
                    ? 'Įrašų nerasta.'
                    : 'Pagal pasirinktus filtrus įrašų nerasta.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            const currentUserId = Number(currentUser.user_id);

            remarks.forEach(r => {
                const tr = document.createElement('tr');

                const studentStrong = document.createElement('strong');
                studentStrong.textContent = r.student || 'Nežinomas';
                tr.appendChild(makeCell('Mokinys', studentStrong));

                tr.appendChild(makeCell('Grupė',
                    document.createTextNode(r.group_display || '-')));

                const badge = document.createElement('span');
                badge.className = `remark-type-badge ${r.type === 'praise' ? 'praise' : 'reprimand'}`;
                badge.textContent = r.type === 'praise' ? 'Pagyrimas' : 'Pastaba';
                tr.appendChild(makeCell('Tipas', badge));

                const contentDiv = document.createElement('div');
                contentDiv.className = 'remark-content-cell';
                contentDiv.textContent = r.content || '-';
                tr.appendChild(makeCell('Turinys', contentDiv));

                tr.appendChild(makeCell('Data',
                    document.createTextNode(r.date || '-')));

                tr.appendChild(makeCell('Mokytojas',
                    document.createTextNode(r.teacher || '-')));

                if (showActions) {
                    const actions = document.createElement('div');
                    actions.className = 'remark-actions';

                    const groupTeacherIds = (r.group_teachers || []).map(Number);
                    const canEdit = groupTeacherIds.includes(currentUserId);

                    if (canEdit) {
                        const editLink = document.createElement('a');
                        editLink.href = `editing/edit_remark?id=${encodeURIComponent(r.remark_id)}`;
                        editLink.textContent = 'Redaguoti';
                        editLink.setAttribute('aria-label', 'Redaguoti įrašą');
                        actions.appendChild(editLink);

                        const deleteBtn = document.createElement('button');
                        deleteBtn.type = 'button';
                        deleteBtn.className = 'delete';
                        deleteBtn.textContent = 'Ištrinti';
                        deleteBtn.setAttribute('aria-label', 'Ištrinti įrašą');
                        deleteBtn.addEventListener('click', () => deleteRemark(r.remark_id));
                        actions.appendChild(deleteBtn);
                    } else {
                        const forbidden = document.createElement('span');
                        forbidden.className = 'actions-forbidden';
                        forbidden.textContent = 'Neturite teisių';
                        actions.appendChild(forbidden);
                    }

                    tr.appendChild(makeCell('Veiksmai', actions));
                }

                tbody.appendChild(tr);
            });
        }

        function filterRemarks() {
            const filterType = document.getElementById('filter_type').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allRemarks.filter(r => {
                if (filterType && r.type !== filterType) return false;
                if (searchText) {
                    const combined = `${r.student || ''} ${r.group_display || ''} ${r.content || ''} ${r.teacher || ''}`.toLowerCase();
                    if (!combined.includes(searchText)) return false;
                }
                return true;
            });

            renderRemarks(filtered);
        }

        document.getElementById('addRemarkForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            if (submittingRemark) return;

            const groupId = document.getElementById('group_select').value;
            const studentId = document.getElementById('student_select').value;
            const type = document.getElementById('type_select').value;
            const content = document.getElementById('remark_content').value.trim();
            const date = document.getElementById('remark_date').value;

            if (!groupId || !studentId || !type || !content || !date) {
                showToast('Užpildykite visus laukus.', 'error');
                return;
            }
            if (content.length > 1000) {
                showToast('Turinys per ilgas (max 1000 simbolių).', 'error');
                return;
            }

            submittingRemark = true;
            const submitBtn = document.getElementById('submitRemarkBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saugoma...';

            try {
                const response = await fetch(`${API_URL}/api/remarks/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        group_id: groupId,
                        student_id: studentId,
                        type: type,
                        content: content,
                        date: date
                    })
                });

                const result = await response.json().catch(() => ({}));
                if (response.ok) {
                    this.reset();
                    setDefaultDate();
                    document.getElementById('student_select').disabled = true;
                    updateContentCounter();
                    showToast('Įrašas sėkmingai išsaugotas!', 'success');
                    await loadRemarks();
                } else {
                    showToast(result.message || 'Nepavyko įrašyti.', 'error');
                }
            } catch (error) {
                showToast('Nepavyko prisijungti prie serverio.', 'error');
            } finally {
                submittingRemark = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Įrašyti';
            }
        });

        async function deleteRemark(remarkId) {
            if (!confirm('Ar tikrai norite ištrinti šį įrašą?')) return;
            try {
                const response = await fetch(`${API_URL}/api/remarks/delete/${encodeURIComponent(remarkId)}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (response.ok) {
                    showToast('Įrašas ištrintas.', 'success');
                    await loadRemarks();
                } else {
                    const result = await response.json().catch(() => ({}));
                    showToast(result.message || 'Nepavyko ištrinti įrašo.', 'error');
                }
            } catch (error) {
                showToast('Nepavyko prisijungti prie serverio.', 'error');
            }
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
